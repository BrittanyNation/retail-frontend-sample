<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trailhead Supply — Storefront Sample</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><h1>Trailhead Supply</h1>
<div class="cart-box">Cart: <span id="cart-count">0</span> items — $<span id="cart-total">0.00</span></div></header>
<main>
  <div class="filters" role="group" aria-label="Filter products">
    <button data-filter="all" class="active">All</button>
    <button data-filter="camp">Camp</button>
    <button data-filter="hike">Hike</button>
    <button data-filter="water">Water</button>
  </div>
  <section id="grid" class="grid" aria-live="polite"></section>
  <section class="cart-detail"><h2>Your cart</h2><ul id="cart-items"></ul><p id="cart-empty">Your cart is empty — add something from the grid above.</p><button id="checkout-btn" type="button" disabled>Checkout</button><p id="order-note" role="status" aria-live="polite"></p></section>
</main>
<footer><p>Trailhead Supply — a fictional brand used for this portfolio sample.</p></footer>
<script src="script.js"></script>
</body></html>
